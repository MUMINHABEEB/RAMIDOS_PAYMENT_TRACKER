<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Payment Recording System</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="flex items-center justify-center p-4 sm:p-6 min-h-screen">

  <div class="w-full max-w-md">
    <!-- Header Logo & Branding -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 mb-4">
        <i class="fas fa-wallet text-2xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to submit and track your internal payment records</p>
    </div>

    <!-- Card Container -->
    <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-xl border border-slate-200/80">
      
      <!-- Alert Container -->
      <div id="alertContainer" class="mb-6 hidden"></div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5" novalidate>
        <div>
          <label for="identifier" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
            Username or Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fas fa-user"></i>
            </div>
            <input 
              type="text" 
              id="identifier" 
              name="identifier" 
              required
              placeholder="e.g. john_doe or john@company.com" 
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fas fa-lock"></i>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
            />
          </div>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-500/20 hover:shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-70 disabled:cursor-not-allowed"
        >
          <span id="btnSpinner" class="spinner hidden"></span>
          <span id="btnText">Log In</span>
        </button>
      </form>

      <!-- Footer navigation -->
      <div class="mt-6 pt-6 border-t border-slate-100 text-center text-sm text-slate-500">
        Don't have an account yet? 
        <a href="/register.html" class="font-semibold text-indigo-600 hover:text-indigo-800 hover:underline">Register here</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
