<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Payment Tracker</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen pb-12">

  <!-- Navbar -->
  <nav class="glass-nav sticky top-0 z-30 border-b border-slate-200/80 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-purple-600 text-white shadow-md shadow-purple-500/20">
          <i class="fas fa-user-shield text-lg"></i>
        </div>
        <div>
          <span class="font-extrabold text-slate-900 text-lg tracking-tight">PayTracker Admin</span>
          <span class="ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-purple-100 text-purple-700 border border-purple-200">System Overview</span>
        </div>
      </div>

      <!-- Navigation Actions -->
      <div class="flex items-center gap-3">
        <a 
          href="/index.html" 
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-xl transition"
        >
          <i class="fas fa-plus-circle"></i>
          <span>Log Payment</span>
        </a>

        <button 
          id="logoutBtn"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-red-600 bg-white hover:bg-red-50 border border-slate-200 hover:border-red-200 rounded-xl transition cursor-pointer"
        >
          <i class="fas fa-sign-out-alt"></i>
          <span class="hidden sm:inline">Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
    
    <!-- Hero / Title -->
    <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">All Colleague Transactions</h1>
        <p class="text-sm text-slate-500 mt-1">Centralized audit trail of all payment submissions and receipts.</p>
      </div>
    </div>

    <!-- Feedback Alerts -->
    <div id="alertContainer" class="mb-6 hidden"></div>

    <!-- Summary Metrics Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
      
      <!-- Metric 1: Total Amount -->
      <div class="glass-card rounded-2xl p-6 shadow-sm border border-slate-200/80 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Volume</p>
          <h3 id="statTotalAmount" class="text-2xl sm:text-3xl font-black text-emerald-600 mt-1">AED 0.00</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl">
          <i class="fas fa-coins"></i>
        </div>
      </div>

      <!-- Metric 2: Total Transactions -->
      <div class="glass-card rounded-2xl p-6 shadow-sm border border-slate-200/80 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Transactions</p>
          <h3 id="statTotalCount" class="text-2xl sm:text-3xl font-black text-indigo-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl">
          <i class="fas fa-receipt"></i>
        </div>
      </div>

      <!-- Metric 3: Active Colleagues -->
      <div class="glass-card rounded-2xl p-6 shadow-sm border border-slate-200/80 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Active Colleagues</p>
          <h3 id="statTotalColleagues" class="text-2xl sm:text-3xl font-black text-purple-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-xl">
          <i class="fas fa-users"></i>
        </div>
      </div>

    </div>

    <!-- Search & Filter Controls -->
    <div class="glass-card rounded-2xl p-4 mb-6 shadow-sm border border-slate-200/80 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- Search Input -->
      <div class="relative w-full sm:w-96">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fas fa-search text-sm"></i>
        </div>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Filter by colleague name, email, or purpose..." 
          class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition"
        />
      </div>

      <!-- Status counter badge -->
      <div class="text-xs font-semibold text-slate-500" id="recordCountDisplay">
        Showing 0 records
      </div>
    </div>

    <!-- Main All Transactions Table -->
    <div class="glass-card rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden">
      <div id="transactionsContainer">
        <div class="p-8 text-center text-slate-400">
          <i class="fas fa-spinner fa-spin text-2xl mb-2 text-purple-500"></i>
          <p class="text-sm font-medium">Loading system payment records...</p>
        </div>
      </div>
    </div>

  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
